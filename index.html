<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123a35">
  <meta name="description" content="FINDERS Real Estate CRM mobile launcher">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <title>FINDERS CRM</title>
  <style>
    :root { color-scheme:light; --bg:#f7f4ec; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:radial-gradient(ellipse at 10% 0%,#fff8e8 0,transparent 42%),
      radial-gradient(ellipse at 100% 100%,#e5f4ed 0,transparent 38%),var(--bg);
      font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; color:#26332f; }
    main { width:min(100%,420px); background:#fffdf8; border:1px solid #e7dfcf; border-radius:26px;
      padding:30px 24px; text-align:center; box-shadow:0 18px 55px #26332f12; }
    img { width:104px;height:104px;object-fit:contain;border-radius:22px; }
    h1 { margin:16px 0 4px; letter-spacing:.08em; font-size:24px; }
    p { color:#6f7b74; margin:8px 0 24px; }
    a { display:block; padding:15px 18px; border-radius:14px; background:linear-gradient(135deg,#e5c76f,#c29a3b);
      color:#3d3218; font-weight:800; text-decoration:none; }
    small { display:block; margin-top:18px; color:#858b84; }
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="FINDERS CRM">
    <h1>FINDERS CRM</h1>
    <p>Employee Mobile Workspace</p>
    <a href="https://script.google.com/macros/s/AKfycbySvkhLrIl_krpoZvJEkLX3QDCYeBw0HOV_E5gsK0xgxL9DTceYsyrvVes5_-NZOVuMtg/exec?view=mobile" target="_self" rel="noopener">Open CRM</a>
    <small>Sign in with your authorized Google account.</small>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
